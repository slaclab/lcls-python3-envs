# Pixi manifest for the rhel7_devel nightly environment.
#
# The nightly build runs `pixi install` against this file, then conda-packs the
# resulting prefix (.pixi/envs/default) exactly as it did with the mamba-created environment.
#
# Supply-chain cooldown: exclude-newer below tells pixi to ignore any conda-forge or PyPI release published
# within the last 7 days, so a compromised release has time to be noticed and yanked before it can reach us.
# The cooldown applies only to packages fetched from a registry. Packages installed from a git URL are not
# affected and always resolve to the current HEAD of their default branch.
#
# To exempt a specific registry package from the cooldown (or give it a different one), add it to one of these
# tables. "0d" means no delay.
#
#   [exclude-newer]              # conda packages
#   openssl = "0d"
#
#   [pypi-exclude-newer]         # PyPI packages
#   slac-alarm-manager = "0d"

[workspace]
name = "rhel7_devel"
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "7d"

[pypi-options.dependency-overrides]
# slac-db still declares "SQLAlchemy>=1.4,<2", but that pin is stale and it works fine with 2.x.
sqlalchemy = ">=2"
# pykern (pulled in by slac-db) pins black to the 24.x series, which conflicts with the current conda-forge black and
# makes the resolver fall back to a 2021 pykern that no longer builds. pykern only uses black as a formatter.
black = ">=24"

