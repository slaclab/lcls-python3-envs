# --- Packages installed from git at the HEAD of their default branch ---
# The key must be the distribution name the project declares in its pyproject.toml/setup.py, which is not
# always the same as the repository name.
badger-opt = { git = "https://github.com/xopt-org/Badger" }
edef = { git = "https://github.com/slaclab/edef" }
edlgenerator = { git = "https://github.com/slaclab/edlgenerator" }
edmbutton = { git = "https://github.com/slaclab/edmbutton" }
emitopt = { git = "https://github.com/dylanmkennedy/emitopt" }
lcls-live = { git = "https://github.com/slaclab/lcls-live" }
lcls-tools = { git = "https://github.com/slaclab/lcls-tools.git" }
# lume-epics main (last commit June 2023) bundles a versioneer that fails under Python 3.12 (configparser.SafeConfigParser
# was removed), so it cannot be built from the default branch. The pre-release branch has a pyproject-based build
# that works. Switch back to the default branch once that work is merged.
lume-epics = { git = "https://github.com/slaclab/lume-epics.git", branch = "pre-release" }
ml_tto = { git = "https://github.com/slaclab/ml-tto" }
mps_database = { git = "https://github.com/slaclab/mps_database" }
#mps_history = { git = "https://github.com/slaclab/mps_history" }  # Its setup.py reads a requirements.txt that is not in the repo, so it cannot be built from git by pip or pixi until that is fixed upstream
pyemittance = { git = "https://github.com/slaclab/PyEmittance" }
timing_core = { git = "https://github.com/slaclab/py-tlib-core.git" }
timing_db = { git = "https://github.com/slaclab/py-tlib-db.git" }
timing_generator = { git = "https://github.com/slaclab/py-tlib-generator.git" }
timing-widgets = { git = "https://github.com/slaclab/py-tlib-widgets.git" }
#slac-db = { git = "https://github.com/slaclab/slac-db" }  # Let something else install slac-db to avoid conflicting versions error
#slac-devices = { git = "https://github.com/slaclab/slac-devices" }  # Is pulled by slac-measurements, will also have conflicting versions error if both are included
slac-measurements = { git = "https://github.com/slaclab/slac-measurements" }
#slac-timing = { git = "https://github.com/slaclab/slac-timing" }  # Is pulled by slac-measurements, will also have conflicting versions error if both are included
#slac-tools = { git = "https://github.com/slaclab/slac-tools" }  # No actual code here yet so leads to a "neither setup.py nor pyproject.toml found" error if included
slacepics = { git = "https://github.com/slaclab/slacepics" }
subprocessca = { git = "https://github.com/slaclab/subprocessca" }
ScPatternSelection = { git = "https://github.com/slaclab/ScPatternSelect.git" }

